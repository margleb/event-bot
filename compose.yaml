services:
  event-bot:
    build:
      context: .
    image: event-bot:local
    container_name: event-bot
    init: true
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  event-sync:
    image: event-bot:local
    pull_policy: never
    container_name: event-bot-sync
    init: true
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          if python -m event_bot.import_events; then
            python -m event_bot.embed_events
          fi
          sleep 86400
        done
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  event-web:
    image: event-bot:local
    pull_policy: never
    container_name: event-bot-web
    init: true
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    command:
      - python
      - -m
      - event_bot.webapp
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/r/health', timeout=5).read()"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
